// <severity>
const CATEGORIES = [
  { id: 'fire', label: 'Fire Emergency', short: 'Fire', icon: 'flame', base: 3 },
  { id: 'road', label: 'Road Accident', short: 'Road Accident', icon: 'car', base: 2 },
  { id: 'medical', label: 'Medical Emergency', short: 'Medical', icon: 'heart', base: 3 },
  { id: 'flood', label: 'Flood', short: 'Flood', icon: 'waves', base: 3 },
  { id: 'police', label: 'Police Assistance', short: 'Police', icon: 'shield', base: 2 },
  { id: 'disaster', label: 'Natural Disaster', short: 'Natural Disaster', icon: 'mountain', base: 4 },
  { id: 'collapse', label: 'Building Collapse', short: 'Building Collapse', icon: 'building', base: 4 },
  { id: 'other', label: 'Other', short: 'Other', icon: 'dots', base: 1 },
];
const TA_KW = ['சிக்கி', 'மயக்கம்', 'வெடி', 'ரத்தம்', 'குழந்தை'];
const KEYWORDS = ['trapped', 'unconscious', 'explosion', 'dead', 'fatal', 'spreading', 'bleeding', 'child'];

function calcSeverity(category, people, description) {
  const cat = CATEGORIES.find(c => c.id === category) || CATEGORIES[CATEGORIES.length - 1];
  const n = Math.max(0, parseInt(people, 10) || 0);
  const peopleAdd = n >= 25 ? 3 : n >= 10 ? 2 : n >= 3 ? 1 : 0;
  const text = String(description || '').toLowerCase();
  const found = KEYWORDS.filter(k => new RegExp('\\b' + k).test(text)).concat(TA_KW.filter(k => text.includes(k)));
  const kwAdd = found.length ? 1 : 0;
  const score = cat.base + peopleAdd + kwAdd;
  const level = score >= 8 ? 'Critical' : score >= 6 ? 'High' : score >= 4 ? 'Medium' : 'Low';
  const reasons = [
    cat.label + ' base score: +' + cat.base,
    n + (n === 1 ? ' person' : ' people') + ' affected: +' + peopleAdd,
    found.length ? 'Urgent wording found (' + found.join(', ') + '): +1' : 'No urgent keywords in the description: +0',
  ];
  return { score, level, reasons, keywords: found };
}
// </severity>

const STATUSES = ['Reported', 'Assigned', 'In Progress', 'Resolved'];

const isActiveCritical = i => i.severity === 'Critical' && i.status !== 'Resolved';

function genId() {
  const d = new Date();
  const ymd = String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  const rnd = Math.random().toString(36).slice(2, 8).toUpperCase();
  return 'RQ-' + ymd + '-' + rnd;
}
function makeIncident(p) {
  const sev = p.override || calcSeverity(p.category, p.people, p.description);
  return {

function ThemeToggle() {
  const [dark, setDark] = useState(() => {
    const t = document.documentElement.getAttribute('data-theme');
    return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  });
  const flip = () => {
    const next = !dark; setDark(next);
    document.documentElement.setAttribute('data-theme', next ? 'dark' : 'light');
    try { localStorage.setItem('resq.theme', next ? 'dark' : 'light'); } catch (e) {}
  };
  return (
    <button onClick={flip} className="btn btn-onnavy" style={{ minHeight: 44, padding: '0 12px' }} aria-label={dark ? 'Switch to light mode' : 'Switch to dark mode'} title="Toggle dark mode">
      <Icon name={dark ? 'sun' : 'moon'} size={20} />
    </button>
  );
}

/* ---------- home ---------- */

/* ---------- report form ---------- */
function Field({ id, label, optional, error, hint, children }) {
  return (
    <div>
      <label htmlFor={id} className="label">{label}{optional && <span className="hint font-normal"> (optional)</span>}</label>
      {children}
      {hint && !error && <div className="hint mt-1">{hint}</div>}
      {error && <div className="err" role="alert"><Icon name="warn" size={16} />{error}</div>}
    </div>
  );
}

function ReportForm({ store, toast, initialCat }) {
  const [f, setF] = useState({ title: '', description: '', category: initialCat || '', location: '', people: '', contactName: '', contactPhone: '' });
  const [errors, setErrors] = useState({});
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(null);
  const [locating, setLocating] = useState(false);
  const set = (k, v) => { setF(p => ({ ...p, [k]: v })); if (errors[k]) setErrors(e => ({ ...e, [k]: undefined })); };
  const nPeople = parseInt(f.people, 10);
  const preview = useMemo(() => (f.category && nPeople > 0) ? calcSeverity(f.category, nPeople, f.description) : null, [f.category, nPeople, f.description]);

  function validate() {
    const e = {};
    if (f.title.trim().length < 4) e.title = 'Add a short title, at least 4 characters. Example: "Kitchen fire in apartment block".';
    if (f.description.trim().length < 10) e.description = 'Describe what you can see, at least 10 characters. Mention anyone trapped, hurt or in danger.';
    if (!f.category) e.category = 'Choose the type of emergency.';
    if (f.location.trim().length < 3) e.location = 'Tell us where this is. A street, landmark or area name works.';
    if (!(nPeople >= 1) || nPeople > 100000) e.people = 'Enter how many people are affected, 1 or more. Your best estimate is fine.';
    if (f.contactPhone.trim() && !/^[0-9+()\-\s]{7,18}$/.test(f.contactPhone.trim())) e.contactPhone = 'This phone number looks incomplete. Use digits only, or leave it blank.';
    return e;
  }
  async function submit(ev) {
    ev.preventDefault();
    const er = validate(); setErrors(er);
    const keys = Object.keys(er);
    if (keys.length) {
      toast('Please check the highlighted fields.', 'err');
      const el = document.getElementById(keys[0] === 'category' ? 'cat-group' : 'f-' + keys[0]);
      if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); if (el.focus) el.focus({ preventScroll: true }); }
      return;
    }
    setBusy(true);
    try {
      const inc = makeIncident({ id: genId(), title: f.title.trim(), description: f.description.trim(), category: f.category, location: f.location.trim(), people: nPeople, contactName: f.contactName.trim(), contactPhone: f.contactPhone.trim(), ...gpsPart(f), status: 'Reported', createdAt: Date.now() });
      const inc2 = await store.prepare(inc); await store.create(inc2);
      setDone(inc2); window.scrollTo(0, 0);
      toast('Report ' + inc.id + ' saved.');
    } catch (err) {
      toast('Your report could not be saved. ' + (err && err.code === 'invalid_argument' ? 'This page needs contributor access to store reports.' : 'Check your connection and try again.'), 'err');
    }
    setBusy(false);
  }
  function useMyLocation() {
    if (!navigator.geolocation) { toast('Location is not available on this device. Type the address or a landmark instead.', 'err'); return; }
    setLocating(true);
    let finished = false;
    const stop = () => { finished = true; setLocating(false); };
    const guard = setTimeout(() => { if (!finished) { stop(); toast('Location did not respond. Type the address or a landmark instead.', 'err'); } }, 9000);
    try {
      navigator.geolocation.getCurrentPosition(
        p => { clearTimeout(guard); stop(); setF(x => ({ ...x, lat: p.coords.latitude, lng: p.coords.longitude, location: p.coords.latitude.toFixed(5) + ', ' + p.coords.longitude.toFixed(5) })); toast('Location added. Add a landmark if you can.'); },
        () => { clearTimeout(guard); stop(); toast('Could not read your location here. Type the address or a landmark instead.', 'err'); },
        { timeout: 8000, enableHighAccuracy: true }
      );
    } catch (e) { clearTimeout(guard); stop(); toast('Could not read your location here. Type the address or a landmark instead.', 'err'); }
  }

  if (done) {
    const cat = catOf(done.category);
    return (
      <div className="card p-6 md:p-8 grid gap-6 max-w-3xl">
        <div className="flex items-start gap-4">
          <div className="w-14 h-14 rounded-2xl grid place-items-center flex-none" style={{ background: 'var(--sev-low-bg)', color: 'var(--sev-low-fg)' }}><Icon name="check" size={30} /></div>
          <div>
            <h1 className="text-3xl font-bold">Report recorded</h1>
            <SyncNote id={done.id} store={store} />
          </div>
        </div>
        <div className="grid gap-3 sm:grid-cols-2">
          <div className="rounded-2xl p-4" style={{ background: 'var(--surface2)' }}>
            <div className="eyebrow">Report ID</div>
            <div className="flex items-center gap-2 flex-wrap mt-1">
              <span className="mono text-xl font-medium break-all">{done.id}</span>
              <button className="btn btn-ghost" style={{ minHeight: 36, padding: '0 10px', fontSize: 14 }} onClick={() => { try { navigator.clipboard.writeText(done.id).then(() => toast('Report ID copied.')).catch(() => toast('Select the ID to copy it.', 'err')); } catch (e) { toast('Select the ID to copy it.', 'err'); } }}><Icon name="copy" size={16} />Copy</button>
            </div>
          </div>
          <div className="rounded-2xl p-4" style={{ background: 'var(--surface2)' }}>
            <div className="eyebrow">Assigned severity</div>
            <div className="flex items-center gap-3 mt-1"><SevBadge level={done.severity} pulse={done.severity === 'Critical'} /><span className="text-muted tnum">score {done.severityScore}</span></div>
          </div>
        </div>
        <div>
          <h2 className="text-xl font-bold mb-2">Why this severity</h2>
          <ul className="grid gap-1.5">{done.severityReasons.map((r, i) => <li key={i} className="flex gap-2"><Icon name="chev" size={18} className="text-muted mt-1" />{r}</li>)}</ul>
        </div>
        <div className="rounded-2xl p-4 text-sm" style={{ background: 'var(--surface2)' }}>
          <b>{done.title}</b> · {cat.label} · {done.location}
        </div>
        <div className="flex flex-wrap gap-3">
          <button className="btn btn-red" onClick={() => { setDone(null); setF({ title: '', description: '', category: '', location: '', people: '', contactName: '', contactPhone: '' }); }}><Icon name="siren" size={20} />Report another</button>
          <a href="#home" className="btn btn-ghost">Back to home</a>
        </div>
      </div>
    );
  }

  return (
    <form onSubmit={submit} noValidate className="grid gap-6 max-w-3xl">
      <div>
        <h1 className="text-4xl font-bold">Report an emergency</h1>
        <p className="text-muted mt-1 text-lg">Fill in what you know. Severity is calculated for you.</p>
      </div>
      <VoiceAssistant onParsed={p => setF(x => ({ ...x, ...p }))} />

      <section className="card p-5 md:p-6 grid gap-5">
        <h2 className="text-2xl font-bold flex items-center gap-2"><span className="eyebrow" style={{ fontSize: 13 }}>Step 1</span>What happened</h2>
        <div id="cat-group" tabIndex={-1} role="radiogroup" aria-label="Emergency category" style={{ outline: 'none' }}>
          <div className="label">Type of emergency</div>
          <div className="grid-cats">
            {CATEGORIES.map(c => (
              <button type="button" key={c.id} role="radio" aria-checked={f.category === c.id} className="catcard" onClick={() => set('category', c.id)}>
                <span className="ic"><Icon name={c.icon} size={26} /></span>{catLabel(c)}
              </button>
            ))}
          </div>
          {errors.category && <div className="err" role="alert"><Icon name="warn" size={16} />{errors.category}</div>}
        </div>
        <Field id="f-title" label="Incident title" error={errors.title}>
          <input id="f-title" className={'field' + (errors.title ? ' bad' : '')} value={f.title} onChange={e => set('title', e.target.value)} placeholder="Short summary, for example: Car overturned on bridge" maxLength={120} autoComplete="off" />
        </Field>
        <Field id="f-description" label="Description" error={errors.description} hint="Mention anyone trapped, hurt or unconscious. These details raise the severity.">
          <textarea id="f-description" className={'field' + (errors.description ? ' bad' : '')} rows={5} value={f.description} onChange={e => set('description', e.target.value)} placeholder="What do you see? How many people need help? Is it spreading?" maxLength={1200} />
        </Field>
      </section>

      <section className="card p-5 md:p-6 grid gap-5">
        <h2 className="text-2xl font-bold flex items-center gap-2"><span className="eyebrow" style={{ fontSize: 13 }}>Step 2</span>Where and who</h2>
        <Field id="f-location" label="Location" error={errors.location}>
          <div className="grid gap-2 sm:grid-cols-[minmax(0,1fr)_auto]">
            <input id="f-location" className={'field' + (errors.location ? ' bad' : '')} value={f.location} onChange={e => set('location', e.target.value)} placeholder="Street, landmark, area, city" autoComplete="street-address" />
            <button type="button" className="btn btn-ghost" onClick={useMyLocation} disabled={locating}><Icon name="locate" size={20} />{locating ? 'Locating…' : 'Use my current location'}</button>
          </div>
        </Field>
        <Field id="f-people" label="Number of people affected" error={errors.people} hint="Your best estimate is fine.">
          <input id="f-people" type="number" inputMode="numeric" min="1" className={'field' + (errors.people ? ' bad' : '')} style={{ maxWidth: 220 }} value={f.people} onChange={e => set('people', e.target.value)} placeholder="e.g. 3" />
        </Field>
      </section>

      <section className="card p-5 md:p-6 grid gap-5">
        <h2 className="text-2xl font-bold flex items-center gap-2"><span className="eyebrow" style={{ fontSize: 13 }}>Step 3</span>Contact <span className="hint font-normal">(optional)</span></h2>
        <div className="grid gap-4 sm:grid-cols-2">
          <Field id="f-contactName" label="Your name" optional><input id="f-contactName" className="field" value={f.contactName} onChange={e => set('contactName', e.target.value)} autoComplete="name" /></Field>
          <Field id="f-contactPhone" label="Phone number" optional error={errors.contactPhone}><input id="f-contactPhone" type="tel" className={'field' + (errors.contactPhone ? ' bad' : '')} value={f.contactPhone} onChange={e => set('contactPhone', e.target.value)} autoComplete="tel" /></Field>
        </div>
      </section>

      <section className="card p-5 grid gap-3" aria-live="polite">
        <div className="eyebrow">Severity preview</div>
        {preview ? (
          <div className="flex items-center gap-3 flex-wrap">
            <SevBadge level={preview.level} pulse={preview.level === 'Critical'} />
            <span className="text-muted tnum">score {preview.score}</span>
            <span className="text-muted text-sm">Updates as you type. The final level is set when you submit.</span>
          </div>
        ) : <p className="text-muted">Choose a type and the number of people to see the severity.</p>}
      </section>

      <button type="submit" className="btn btn-red btn-lg w-full sm:w-auto sm:justify-self-start" disabled={busy}>
        <Icon name="siren" size={24} />{busy ? 'Sending report…' : 'Submit emergency report'}
      </button>
    </form>
  );
}

/* ---------- admin ---------- */
function StatCard({ label, value, sub, icon, tone }) {
  const crit = tone === 'crit';
  return (
    <div className="card p-4 md:p-5" style={crit ? { borderColor: 'var(--c-critical)', borderWidth: 2 } : null}>
      <div className="flex items-center justify-between gap-2">
        <div className="eyebrow">{label}</div>
        <div className="w-9 h-9 rounded-xl grid place-items-center" style={{ background: crit ? 'var(--redsoft)' : 'var(--surface2)', color: crit ? 'var(--red)' : 'var(--fg)' }}><Icon name={icon} size={19} /></div>
      </div>
      <div className="font-display font-bold tnum mt-2" style={{ fontSize: 44, lineHeight: 1, color: crit ? 'var(--red)' : 'var(--fg)' }}>{value}</div>

function IncidentRow({ i }) {
  const crit = isActiveCritical(i);
  const cat = catOf(i.category);
  return (
    <a href={'#incident-' + i.id} className={'row' + (crit ? ' crit' : '')} style={{ '--stripe': 'var(--c-' + i.severity.toLowerCase() + ')' }}>
      <div className="flex items-center gap-2 flex-wrap">
        <SevBadge level={i.severity} pulse={crit} />

/* SOS: 5-second cancel window, GPS request, manual fallback */
function SOS({ store, toast }) {
  const [ph, setPh] = useState('idle'), [n, setN] = useState(5), [gps, setGps] = useState(null), [gErr, setGErr] = useState(''), [loc, setLoc] = useState(''), [res, setRes] = useState(null);
  const g = useRef(null);
  function start() {
    setPh('count'); setN(5); setGps(null); g.current = null; setGErr('');
    if (!navigator.geolocation) { setGErr('GPS is not available on this device.'); return; }
    navigator.geolocation.getCurrentPosition(p => { g.current = { lat: p.coords.latitude, lng: p.coords.longitude }; setGps(g.current); },
      e => setGErr(e.code === 1 ? 'Location permission was denied.' : 'Could not read GPS.'), { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 });
  }
  const cancel = () => { setPh('idle'); toast('SOS cancelled. Nothing was saved.'); };
  useEffect(() => {
    if (ph !== 'count') return;
    if (n <= 0) { g.current ? send(g.current, '') : setPh('wait'); return; }
    const id = setTimeout(() => setN(n - 1), 1000); return () => clearTimeout(id);
  }, [ph, n]);
  useEffect(() => { if (ph === 'wait' && gps) send(gps, loc); }, [ph, gps]);
  useEffect(() => { if (ph === 'idle' || ph === 'done') return; const k = e => { if (e.key === 'Escape' && ph !== 'sending') cancel(); }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, [ph]);
  async function send(c, text) {
    setPh('sending');
    const inc = makeIncident({ id: genId(), title: 'SOS alert', description: 'SOS button activated by the reporter.' + (text ? ' Manual location: ' + text : ''), category: 'other',
      location: c ? c.lat.toFixed(5) + ', ' + c.lng.toFixed(5) : (text || 'Location not provided'), people: 1, lat: c ? c.lat : null, lng: c ? c.lng : null, sos: true, status: 'Reported', createdAt: Date.now(),
      override: { level: 'Critical', score: 10, reasons: ['SOS button pressed: treated as Critical until staff review it', 'Location source: ' + (c ? 'GPS' : text ? 'typed by the reporter' : 'not provided')] } });
    try { await store.create(inc); setRes(inc); setPh('done'); } catch (e) { toast('SOS could not be saved. Call 112 now.', 'err'); setPh('idle'); }
  }
  const live = res && ((store.items || []).find(i => i.id === res.id) || res);
  return (
    <section className="card p-6 grid justify-items-center gap-3 text-center" aria-label="SOS">
      <button className="sosbtn" onClick={start} aria-label="SOS emergency button">SOS</button>
      <p className="text-muted" style={{ maxWidth: 420 }}>{t('sos_hint')}</p>
      <a href="tel:112" className="btn btn-ghost"><Icon name="phone" size={20} />{t('call112')}</a>
      {ph !== 'idle' && (
        <div className="overlay"><div className="dialog" role="alertdialog" aria-modal="true" aria-labelledby="sos-t">
          {ph === 'count' && <>
            <h2 id="sos-t" className="text-3xl font-bold" style={{ color: 'var(--red)' }}>{t('sos_count')} <span className="tnum">{n}</span></h2>
            <p className="text-muted mt-1">{gps ? 'GPS location found.' : gErr ? gErr + ' You can type your location next.' : 'Getting your GPS location…'}</p>
            <button className="btn btn-red btn-lg w-full mt-5" autoFocus onClick={cancel}><Icon name="x" size={24} />{t('cancel')}</button>
          </>}
          {ph === 'wait' && <>
            <h2 id="sos-t" className="text-2xl font-bold">Where are you?</h2>
            <p className="text-muted mt-1">{gErr || 'Waiting for GPS…'} Type your location, or send without it.</p>
            <label htmlFor="sos-loc" className="label mt-4">Location (street, landmark, area)</label>
            <input id="sos-loc" className="field" value={loc} onChange={e => setLoc(e.target.value)} autoFocus />
            <div className="flex gap-3 mt-4 flex-wrap">
              <button className="btn btn-ghost flex-1" onClick={cancel}>{t('cancel')}</button>
              <button className="btn btn-red flex-1" onClick={() => send(g.current, loc.trim())}>Send SOS</button>
            </div>
          </>}
          {ph === 'sending' && <h2 id="sos-t" className="text-2xl font-bold">Saving SOS…</h2>}
          {ph === 'done' && live && <>
            <h2 id="sos-t" className="text-2xl font-bold">SOS recorded</h2>
            <div className="mono mt-2 break-all">{live.id}</div>
            <div className="hint">{fmtDate(live.createdAt)}</div>
            <div className="mt-3"><SyncNote id={live.id} store={store} /></div>
            <a href="tel:112" className="btn btn-red w-full mt-4"><Icon name="phone" size={20} />{t('call112')}</a>
            <button className="btn btn-ghost w-full mt-2" onClick={() => setPh('idle')}>Close</button>
          </>}
        </div></div>
      )}
    </section>
  );
}

const RULES = [

  ['collapse', /இடிந்து|collapse/i], ['flood', /வெள்ளம்|நீர் புகு|flood|waterlog/i],
  ['disaster', /நிலநடுக்கம்|புயல்|நிலச்சரிவு|சுனாமி|earthquake|cyclone|landslide|tsunami|storm/i],
  ['medical', /மருத்துவ|ஆம்புலன்ஸ்|மயக்க|மூச்சு|நெஞ்சு வலி|ரத்தம்|heart attack|unconscious|ambulance|medical|bleeding|not breathing|injur/i],
  ['road', /சாலை விபத்து|வாகன விபத்து|மோதி|விபத்து|accident|crash|collision|overturned/i],
  ['police', /போலீஸ்|காவல்|திருட்டு|கொள்ளை|தாக்க|police|theft|robbery|attack|assault|threat/i],
];
function parseSpeech(s) {
  let category = ''; for (const [id, re] of RULES) if (re.test(s)) { category = id; break; }
  let location = ''; const m = s.match(/\b(?:in|at|near|on)\s+((?:[A-Z][\w.'-]*\s?){1,4})/);
  if (m) location = m[1].trim(); else { const low = s.toLowerCase(); for (const k in CITIES) if (low.includes(k)) { location = k; break; } }
  const p = s.match(/(\d+)\s*(?:people|persons|பேர்)/i);

function speak(text, lang) { try { if (!window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = lang === 'ta' ? 'ta-IN' : 'en-IN'; speechSynthesis.speak(u); } catch (e) {} }
function VoiceAssistant({ onParsed }) {
  const [lang, setLang] = useState(LANG), [txt, setTxt] = useState(''), [on, setOn] = useState(false), [msg, setMsg] = useState('');
  function analyze(text) {
    const s = (text || '').trim(); if (!s) { setMsg(lang === 'ta' ? 'முதலில் ஏதாவது சொல்லவும் அல்லது தட்டச்சு செய்யவும்.' : 'Say or type something first.'); return; }
    const p = parseSpeech(s), cat = CATEGORIES.find(c => c.id === p.category), patch = { description: s };
    if (cat) { patch.category = cat.id; patch.title = cat.label + ' (voice report)'; } if (p.location) patch.location = p.location; if (p.people) patch.people = p.people;
    onParsed(patch);
    const say = lang === 'ta'
      ? (cat ? 'புரிந்தது: ' + CAT_TA[cat.id] + '. ' : 'அவசரத்தின் வகை தெரியவில்லை. தேர்வு செய்யவும். ') + (p.location ? 'இடம்: ' + p.location + '. ' : 'இடம் கண்டறியப்படவில்லை. தயவுசெய்து சேர்க்கவும். ') + 'படிவத்தைச் சரிபார்த்து சமர்ப்பிக்கவும். இன்னும் எதுவும் அனுப்பப்படவில்லை.'
      : (cat ? 'I understood: ' + cat.label + '. ' : 'I could not tell the type of emergency. Please choose one. ') + (p.location ? 'Location: ' + p.location + '. ' : 'I could not find a location. Please add it. ') + 'Review the form and press submit. Nothing has been sent yet.';
    setMsg(say); speak(say, lang);
  }
  function listen() {
    if (!SR) { setMsg('Voice input is not supported in this browser. Type below instead.'); return; }
    const r = new SR(); r.lang = lang === 'ta' ? 'ta-IN' : 'en-IN'; r.interimResults = false;
    r.onresult = e => { const s = e.results[0][0].transcript; setTxt(s); analyze(s); };
    r.onerror = e => { setOn(false); setMsg(e.error === 'not-allowed' ? 'Microphone permission was denied. Type below instead.' : e.error === 'network' ? 'The speech service is not reachable. Type below instead.' : e.error === 'no-speech' ? 'No speech heard. Try again or type below.' : 'Voice input failed. Type below instead.'); };

    <section className="card p-5 grid gap-3" aria-label={t('voice_h')}>
      <div className="flex items-center justify-between gap-2 flex-wrap">
        <h2 className="text-2xl font-bold">{t('voice_h')}</h2>
        <div className="seg" role="group" aria-label="Voice language">
          <button type="button" aria-pressed={lang === 'ta'} onClick={() => setLang('ta')}>தமிழ்</button>
          <button type="button" aria-pressed={lang === 'en'} onClick={() => setLang('en')}>English</button>
        </div>
      </div>
      <textarea className="field" rows={3} value={txt} onChange={e => setTxt(e.target.value)} aria-label="Describe the emergency"
        placeholder={lang === 'ta' ? 'எ.கா: எங்க ஏரியாவில் தீ விபத்து ஏற்பட்டிருக்கு.' : 'e.g. There is a road accident near Velachery Chennai, 3 people hurt.'} />
      <div className="flex gap-2 flex-wrap">
        <button type="button" className="btn btn-navy" onClick={listen} disabled={on}><Icon name="phone" size={20} />{on ? t('listening') : t('speak')}</button>
        <button type="button" className="btn btn-ghost" onClick={() => analyze(txt)}>{t('analyze')}</button>
        <button type="button" className="btn btn-ghost" onClick={() => { setLang('ta'); setTxt('எங்க ஏரியாவில் தீ விபத்து ஏற்பட்டிருக்கு.'); }}>Tamil example</button>
      </div>
      {!SR && <p className="hint">Voice recognition is not available here (Chrome or Edge work best). The text box works everywhere.</p>}
      {msg && <p role="status" className="font-medium">{msg}</p>}
    </section>

}

/* Leaflet + OpenStreetMap. Demo data is always labelled. Route from OSRM when reachable. */
function MapView({ incidents, teams, selInc, selTeam, h = 420 }) {
  const el = useRef(null), map = useRef(null), layer = useRef(null), [info, setInfo] = useState('');
  const ok = typeof L !== 'undefined';
  useEffect(() => {
    if (!ok || !el.current) return;
    map.current = L.map(el.current).setView([11.1, 78.6], 7);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap contributors' }).addTo(map.current);
    layer.current = L.layerGroup().addTo(map.current);
    return () => { map.current.remove(); map.current = null; };
  }, []);
  useEffect(() => {
    if (!map.current) return; layer.current.clearLayers(); const pts = [];
    incidents.forEach(i => { const p = pos(i); if (!p) return; pts.push([p.lat, p.lng]);
      L.circleMarker([p.lat, p.lng], { radius: i === selInc ? 13 : 9, color: '#fff', weight: 2, fillColor: SEVCOL[i.severity], fillOpacity: .95 })
        .bindPopup('<b>' + esc(i.title) + '</b><br>' + esc(i.severity) + ' · ' + esc(i.status) + '<br>' + (i.demo ? '<b>DEMO DATA</b>: sample location, not a real GPS fix' : p.approx ? 'Approximate position from the place name' : 'GPS location from the report')).addTo(layer.current); });
    teams.forEach(x => L.marker([x.lat, x.lng], { icon: L.divIcon({ className: '', iconSize: [28, 28], html: '<div class="tmk" style="background:' + TEAMCOL[x.status] + '">' + TEAM_LETTER[x.type] + '</div>' }) })
      .bindPopup('<b>' + esc(x.name) + '</b><br>' + esc(TEAM_TYPES[x.type]) + ' · ' + esc(x.status) + (x.demo ? '<br><b>DEMO DATA</b>: sample team location' : '')).addTo(layer.current));
    if (pts.length && !selInc) map.current.fitBounds(pts, { padding: [30, 30], maxZoom: 12 });
  }, [incidents, teams, selInc]);
  useEffect(() => {
    setInfo(''); if (!map.current || !selInc || !selTeam) return;
    const a = { lat: selTeam.lat, lng: selTeam.lng }, b = pos(selInc); if (!b) { setInfo('This incident has no usable location, so no route can be drawn.'); return; }
    let dead = false; const rl = L.layerGroup().addTo(map.current), km = hav(a, b);
    const straight = () => { if (dead) return; const l = L.polyline([[a.lat, a.lng], [b.lat, b.lng]], { color: '#2765F0', weight: 4, dashArray: '6 8' }).addTo(rl); map.current.fitBounds(l.getBounds(), { padding: [30, 30] }); setInfo('Road routing is unavailable. The dashed line is a straight-line distance of about ' + km.toFixed(1) + ' km, not a route.'); };
    fetch('https://router.project-osrm.org/route/v1/driving/' + a.lng + ',' + a.lat + ';' + b.lng + ',' + b.lat + '?overview=full&geometries=geojson')
      .then(r => r.json()).then(j => { if (dead) return; const r = j.routes && j.routes[0]; if (!r) return straight(); const l = L.geoJSON(r.geometry, { style: { color: '#2765F0', weight: 5 } }).addTo(rl); map.current.fitBounds(l.getBounds(), { padding: [30, 30] }); setInfo('Route: ' + (r.distance / 1000).toFixed(1) + ' km, about ' + Math.round(r.duration / 60) + ' min by road (estimate from the public OSRM demo server).'); })
      .catch(straight);
    return () => { dead = true; rl.remove(); };
  }, [selInc && selInc.id, selTeam && selTeam.id]);
  if (!ok) return <div className="card p-5"><b>The map library could not load.</b><p className="text-muted">Check your internet connection. Incident and team lists still work.</p></div>;
  return (
    <div className="grid gap-2">
      <div ref={el} className="card" style={{ height: h, isolation: 'isolate', overflow: 'hidden' }} role="application" aria-label="Incident and team map" />
      <p className="hint">Markers marked DEMO are sample locations, not real-time GPS. Circles are incidents (colour = priority). Squares are teams (green available, orange busy, grey offline). Map tiles need internet.</p>
      {info && <p role="status" className="font-medium">{info}</p>}
    </div>
  );
}

function IncidentOps({ inc, store, toast }) {
  const rec = useMemo(() => recommend(inc, store.teams), [inc, store.teams]);
  const [pick, setPick] = useState(null);
  const sel = rec.find(x => x.id === pick) || rec[0] || null, assigned = store.teams.find(x => x.id === inc.teamId);
  async function assign() {
    try { await store.assign(inc.id, sel.id); toast(store.mode === 'server' ? 'Assignment recorded on the server.' : 'DEMO assignment saved in this browser only. No real team was contacted.'); }
    catch (e) { toast(e.status === 403 ? 'Only admins can assign teams.' : 'Assignment failed. Try again.', 'err'); }
  }
  return (
    <div className="grid gap-5 mt-5">
      <section className="card p-5 grid gap-3">
        <h2 className="text-2xl font-bold">Recommended team</h2>
        {assigned && <div className="rounded-xl p-3 st-progress font-semibold">Assignment recorded: {assigned.name}{assigned.demo ? ' (DEMO team)' : ''}</div>}
        {rec.length === 0 ? <p className="text-muted">No available team of a suitable type was found. Check team status or call 112.</p> : (
          <div className="grid gap-2" role="radiogroup" aria-label="Suggested teams">
            {rec.slice(0, 3).map((x, i) => (
              <button key={x.id} type="button" role="radio" aria-checked={sel && sel.id === x.id} className="catcard" style={{ flexDirection: 'row', justifyContent: 'space-between', minHeight: 64, textAlign: 'left' }} onClick={() => setPick(x.id)}>
                <span><b>{i === 0 ? 'Nearest suitable: ' : ''}{x.name}</b> {x.demo && <span className="badge st-reported">DEMO</span>}<br /><span className="hint">{TEAM_TYPES[x.type]}</span></span>
                <span className="tnum font-bold">{x.km == null ? 'distance unknown' : x.km.toFixed(1) + ' km'}</span>
              </button>))}
          </div>)}
        {store.can('assign') && sel && inc.status !== 'Resolved' && <button className="btn btn-navy" onClick={assign}>Record assignment to {sel.name}</button>}
        {!store.can('assign') && <p className="hint">Only admins can record assignments.</p>}
        <p className="hint">This is a recommendation, not a dispatch. {store.mode === 'server' ? 'Staff must contact the team through their normal channel; this app has no radio or CAD integration.' : 'DEMO MODE: no real team is ever contacted.'}</p>
      </section>
      <section className="card p-5 grid gap-3"><h2 className="text-2xl font-bold">Location and route</h2>
        <MapView incidents={[inc]} teams={store.teams} selInc={inc} selTeam={sel || assigned} h={320} /></section>
      <section className="card p-5 grid gap-3"><h2 className="text-2xl font-bold">History</h2>
        <ol className="grid gap-3">{(inc.history || []).slice().reverse().map((x, i) => (
          <li key={i} className="flex gap-3 flex-wrap items-baseline"><StatusBadge status={x.status} /><span className="tnum text-sm text-muted">{fmtDate(x.at)}</span><span className="text-sm">{x.note} · {x.by}</span></li>))}</ol></section>
    </div>
  );
}

function Analytics({ items, teams, mode }) {
  const a = items || [], tot = a.length || 1, C = 2 * Math.PI * 52; let off = 0;
  const pr = ['Critical', 'High', 'Medium', 'Low'].map(l => ({ l, n: a.filter(i => i.severity === l).length }));
  const stt = STATUSES.map(s => ({ s, n: a.filter(i => i.status === s).length }));
  return (
    <section className="grid gap-4" aria-label="Analytics">
      {mode === 'demo' && <div className="sev-medium text-sm font-semibold" style={{ padding: '8px 12px', borderRadius: 10 }}>DEMO DATA: charts count the sample incidents plus any reports saved in this browser.</div>}
      <div className="two">
        <div className="card p-5 grid gap-3"><h2 className="text-2xl font-bold">Priority distribution</h2>
          <div className="flex items-center gap-5 flex-wrap">
            <svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label={'Priority: ' + pr.map(p => p.l + ' ' + p.n).join(', ')}>
              <circle cx="70" cy="70" r="52" fill="none" style={{ stroke: 'var(--surface2)' }} strokeWidth="22" />
              {pr.map(p => { const len = p.n / tot * C, e = <circle key={p.l} cx="70" cy="70" r="52" fill="none" style={{ stroke: 'var(--c-' + p.l.toLowerCase() + ')' }} strokeWidth="22" strokeDasharray={len + ' ' + (C - len)} strokeDashoffset={-off} transform="rotate(-90 70 70)" />; off += len; return e; })}
              <text x="70" y="76" textAnchor="middle" className="font-display" style={{ fill: 'var(--fg)', fontSize: 26, fontWeight: 700 }}>{a.length}</text>
            </svg>
            <ul className="grid gap-1">{pr.map(p => <li key={p.l} className="flex items-center gap-2"><SevBadge level={p.l} /><b className="tnum">{p.n}</b></li>)}</ul>
          </div></div>
        <div className="card p-5 grid gap-3"><h2 className="text-2xl font-bold">Status</h2>
          {stt.map(x => <div key={x.s} className="grid items-center gap-3" style={{ gridTemplateColumns: '110px minmax(0,1fr) 28px' }}><span className="text-sm font-semibold">{x.s}</span><div className="bar"><span style={{ width: (x.n / tot * 100) + '%' }} /></div><b className="tnum text-right">{x.n}</b></div>)}</div>
      </div>
      <div className="card p-5 grid gap-3"><h2 className="text-2xl font-bold">Team availability</h2>
        {Object.keys(TEAM_TYPES).map(k => { const l = teams.filter(x => x.type === k); return (
          <div key={k} className="grid items-center gap-3" style={{ gridTemplateColumns: '130px minmax(0,1fr)' }}>
            <span className="text-sm font-semibold">{TEAM_TYPES[k]}</span>
            <div className="flex gap-1 flex-wrap">{l.length === 0 ? <span className="hint">none</span> : l.map(x => <span key={x.id} title={x.name + ': ' + x.status} className={'badge ' + TS[x.status]}>{x.status}</span>)}</div>
          </div>); })}</div>
    </section>
  );
}

function TeamsPage({ store, toast }) {
  const set = async (tm, s) => { try { await store.setTeamStatus(tm.id, s); toast(tm.name + ': ' + s); } catch (e) { toast(e.status === 403 ? 'You can only change your own team.' : 'Could not update the team.', 'err'); } };

    <div className="grid gap-5">
      <div><h1 className="text-4xl font-bold">{t('teams')}</h1><p className="text-muted mt-1">{store.mode === 'demo' ? 'DEMO DATA: sample teams. Status changes are saved in this browser only.' : 'Team status from the server.'}</p></div>
      {Object.keys(TEAM_TYPES).map(k => { const list = store.teams.filter(x => x.type === k); return (
        <section key={k} className="grid gap-3"><h2 className="text-2xl font-bold">{TEAM_TYPES[k]} <span className="hint font-normal">({list.filter(x => x.status === 'Available').length}/{list.length} available)</span></h2>
          <div className="grid gap-3 md:grid-cols-2">{list.map(tm => (

              <div className="flex items-center gap-2 flex-wrap"><b>{tm.name}</b>{tm.demo && <span className="badge st-reported">DEMO</span>}<span className={'badge ml-auto ' + TS[tm.status]}><i />{tm.status}</span></div>
              <select className="field" value={tm.status} onChange={e => set(tm, e.target.value)} aria-label={'Status of ' + tm.name}>{['Available', 'Busy', 'Offline'].map(s => <option key={s}>{s}</option>)}</select>
            </div>))}</div></section>); })}

function MapPage({ store }) {
  const [iid, setI] = useState(''), [tid, setT] = useState('');

  return (

        <select className="field" value={iid} onChange={e => setI(e.target.value)} aria-label="Incident"><option value="">Select incident</option>{(store.items || []).map(i => <option key={i.id} value={i.id}>{i.severity} · {i.title}</option>)}</select>

function Login({ store, toast }) {
  const [email, setEmail] = useState(''), [pw, setPw] = useState(''), [err, setErr] = useState(''), [busy, setBusy] = useState(false);
  async function go(e) {
    e.preventDefault(); setBusy(true); setErr('');
    try { await store.login(email, pw); toast('Signed in.'); } catch (x) { setErr(x.name === 'AbortError' ? 'The server did not respond. Check your connection.' : x.message || 'Sign in failed.'); }
    setBusy(false);
  }
  return (
    <form onSubmit={go} className="card p-6 md:p-8 grid gap-4 max-w-md mx-auto w-full mt-4" noValidate>
      <div className="w-14 h-14 rounded-2xl grid place-items-center" style={{ background: 'var(--navy2)', color: '#fff' }}><Icon name="lock" size={28} /></div>
      <div><h1 className="text-3xl font-bold">Staff sign in</h1><p className="text-muted">Admins and responders only. Reporting does not need an account.</p></div>
      <Field id="f-email" label="Email"><input id="f-email" type="email" className="field" value={email} onChange={e => setEmail(e.target.value)} autoComplete="username" /></Field>
      <Field id="f-pw" label="Password" error={err}><input id="f-pw" type="password" className={'field' + (err ? ' bad' : '')} value={pw} onChange={e => { setPw(e.target.value); setErr(''); }} autoComplete="current-password" /></Field>
      <button className="btn btn-red" type="submit" disabled={busy}>{busy ? 'Signing in…' : 'Sign in'}</button>
      {store.mode === 'demo' && <div className="rounded-xl p-3 text-sm grid gap-2" style={{ background: 'var(--surface2)' }}><b>DEMO accounts (no backend, not secure)</b>
        {DEMO_ACCOUNTS.map(a => <button key={a.email} type="button" className="btn btn-ghost" style={{ minHeight: 40 }} onClick={() => { setEmail(a.email); setPw(a.password); }}>{a.role}: {a.email}</button>)}</div>}
      {store.mode === 'connecting' && <p className="hint">Connecting to the server…</p>}
    </form>
  );
}

/* ---------- app ---------- */
function App() {
  const store = useStore();
  const route = useHashRoute();
  const [lang, setLang] = useState(() => { try { return localStorage.getItem('resq.lang') || 'en'; } catch (e) { return 'en'; } });
  LANG = lang;
  const [toasts, setToasts] = useState([]);
  const toast = useCallback((msg, type) => {
    const id = Math.random();
    setToasts(x => [...x, { id, msg, type }]);
    setTimeout(() => setToasts(x => x.filter(y => y.id !== id)), 4800);
  }, []);
  useEffect(() => {
    try { const th = localStorage.getItem('resq.theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}
    const f = () => setLang(l => { const n = l === 'en' ? 'ta' : 'en'; try { localStorage.setItem('resq.lang', n); } catch (e) {} document.documentElement.lang = n; return n; });
    window.addEventListener('resq-lang', f); return () => window.removeEventListener('resq-lang', f);
  }, []);
  const logout = () => { store.logout(); location.hash = 'home'; toast('Signed out.'); };
  const staff = route === 'admin' || route === 'map' || route === 'teams' || route.startsWith('incident-');
  let page;
  if (route.startsWith('report')) page = <ReportForm key={route} store={store} toast={toast} initialCat={route.startsWith('report-') ? route.slice(7) : ''} />;
  else if (staff) page = !store.user ? <Login store={store} toast={toast} />
    : route === 'map' ? <MapPage store={store} /> : route === 'teams' ? <TeamsPage store={store} toast={toast} />
    : route === 'admin' ? <Admin store={store} /> : <Detail id={route.slice(9)} store={store} toast={toast} />;
  else page = <Home store={store} toast={toast} />;
  return (
    <React.Fragment key={lang}>
      <Header />
      <DemoBanner mode={store.mode} online={store.online} />
      <div className="shell gutter">
        <Sidebar route={route} admin={!!store.user} onLogout={logout} />
        <main className="min-w-0">
          {store.user && staff && <div className="hint mb-3">Signed in as {store.user.email} · <b>{store.user.role}</b>{store.user.demo ? ' (DEMO account)' : ''}</div>}
          {page}
          {store.user && staff && <div className="mt-8 md:hidden"><button className="btn btn-ghost w-full" onClick={logout}><Icon name="logout" size={20} />Sign out</button></div>}
        </main>
      </div>
      <BottomNav route={route} />
      <Toasts list={toasts} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
